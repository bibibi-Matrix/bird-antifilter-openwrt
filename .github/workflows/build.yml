name: Build OpenWrt packages

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - x86_64-openwrt-25.12
          - mediatek-filogic-openwrt-25.12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build packages in OpenWrt SDK container
        run: |
          docker run --privileged --rm \
            -v "$PWD":/work:rw \
            -w /builder \
            docker.io/openwrt/sdk:${{ matrix.sdk }} \
            bash -c '
              set -e
              [ -d ./scripts ] || ./setup.sh
              ./scripts/feeds update base packages routing luci
              echo "src-link bird /work" >> feeds.conf.default
              ./scripts/feeds update bird
              ./scripts/feeds install -p luci luci-base luci-mod-rpc luci-lib-ipkg rpcd-mod-ucode ucode-mod-fs ucode-mod-uci
              ./scripts/feeds install -a -p bird
              make defconfig
              make package/feeds/bird/bird/compile -j$(nproc)
              make package/feeds/bird/luci-app-bird/compile -j$(nproc)
              make package/feeds/bird/bird/install
              make package/feeds/bird/luci-app-bird/install
              make package/index
            '

      - name: Upload packages
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.sdk }}
          path: |
            bin/packages/*/
          if-no-files-found: warn
